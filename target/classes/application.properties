spring.application.name=TheClearVision

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/theclearvision}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Kelzdr@w123}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Flyway Configuration
spring.flyway.repair=true

# JWT Configuration
jwt.secret=${JWT_SECRET:your-secret-key-here-change-in-production}
jwt.expiration=86400000

# Email Configuration
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
# Disable mail health check to avoid errors when credentials are missing
management.health.mail.enabled=false

# Application Configuration
app.name=TheClearVision
app.email.from=${MAIL_FROM:noreply@theclearvision.com}

# Server Configuration
server.port=${SERVER_PORT:8080}

# Google OAuth
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/google

# Frontend URL for OAuth redirect
app.frontend.url=${FRONTEND_URL:http://localhost:5173}
